  /api/v2/academic-pathways/{regdid_id}/:
    get:
      operationId: v2_academic_pathways_list
      description: API endpoints for managing academic pathways. Provides functionality
        to list all academic pathways and retrieve detailed information about specific
        pathways, including their associated study activities.
      summary: List all Academic pathways for a specific didactic regulation
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
          format: int32
      - in: path
        name: regdid_id
        schema:
          type: string
          pattern: ^\d+$
        description: A unique value identifying the Didactic regulation.
        required: true
      tags:
      - v2
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicPathwaysListList'
              examples:
                Single:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - id: 1
                        cod: '123'
                        name: GENERIC
                        duration: 2
                  description: Single academic pathway
                Multiple:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - - id: 1
                        cod: '123'
                        name: GENERIC
                        duration: 2
                      - id: 2
                        cod: '321'
                        name: OTHER
                        duration: 3
                  description: Multiple academic pathways
          description: Success
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              examples:
                BadRequest:
                  value:
                    detail: Invalid input.
                  summary: Bad Request
          description: Bad Request
