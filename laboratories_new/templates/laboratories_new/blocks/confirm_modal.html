{% load i18n static %}
{# Parametri: modal_id, modal_suffix (opzionale), message, url #}
<div
  class="modal fade"
  tabindex="-1"
  role="dialog"
  id="{{ modal_id }}{{ modal_suffix }}"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{% trans "Confirm" %}</h5>
        <button
          class="close"
          type="button"
          data-dismiss="modal"
          aria-label="Close"
        >
          <svg class="icon">
            <use xlink:href="{% static 'svg/sprite.svg' %}#it-close"></use>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p>{{ message }}</p>
      </div>
      <div class="modal-footer">
        <a class="btn btn-success btn-sm" href="{{ url }}">{% trans 'Yes, proceed' %}</a>
      </div>
    </div>
  </div>
</div>
